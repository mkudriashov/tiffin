<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#fcfcfb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171a1b" media="(prefers-color-scheme: dark)">
<title>Tiffin</title>
<base href="{{ROOT}}">
<link rel="preload" href="{{static:ibm-plex-sans-latin-400-normal.woff2}}" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{static:ibm-plex-sans-latin-600-normal.woff2}}" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"IBM Plex Sans";font-weight:400;font-display:swap;src:url("{{static:ibm-plex-sans-latin-400-normal.woff2}}") format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-weight:600;font-display:swap;src:url("{{static:ibm-plex-sans-latin-600-normal.woff2}}") format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-weight:500;font-display:optional;src:url("{{static:ibm-plex-mono-latin-500-normal.woff2}}") format("woff2")}
</style>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="{{static:app.css}}">
<link rel="stylesheet" href="{{static:plan.css}}">
<link rel="stylesheet" href="{{static:progress.css}}">
<link rel="stylesheet" href="{{static:choose.css}}">
<link rel="stylesheet" href="{{static:wide.css}}">
</head>
<body>
<header>
  <h1>Tiffin</h1>
  <p id="who" class="muted"></p>
  <p id="stamp" class="muted"></p>
</header>

<main>
  <div id="boot-failed" class="panel" role="alert" hidden></div>
  <div id="status-strip" role="status" hidden></div>

  <!-- Menu is one destination with three views: the days, the cook, the book. One row of
       choices over whichever of the three is open -->
  <div id="menu-views" class="views" role="group" aria-label="Menu" hidden>
    <button type="button" data-view="menu" aria-pressed="false">Days</button>
    <button type="button" data-view="batch" aria-pressed="false">Cook</button>
    <button type="button" data-view="dishes" aria-pressed="false">Recipes</button>
    <button type="button" data-view="choose" aria-pressed="false" hidden>Choose</button>
  </div>

  <section id="today" class="tab on" aria-label="Today">
    <div class="row" id="today-date">
      <button type="button" id="day-prev" class="step" aria-label="The day before">&lsaquo;</button>
      <label for="day" class="visually-hidden">Date</label>
      <input type="date" id="day">
      <button type="button" id="day-next" class="step" aria-label="The day after">&rsaquo;</button>
      <button type="button" id="day-today" hidden>Today</button>
    </div>
    <div id="today-rings" class="cards"></div>
    <div id="today-detail"></div>
  </section>

  <section id="menu" class="tab" aria-label="Menu: days"><div id="menu-body"></div></section>
  <section id="batch" class="tab" aria-label="Menu: cook"><div id="batch-body"></div></section>
  <section id="dishes" class="tab" aria-label="Menu: recipes"><div id="dishes-body"></div></section>
  <!-- weekly choices: next week's meals picked from a few dishes each (choose.js) -->
  <section id="choose" class="tab" aria-label="Menu: choose"><div id="choose-body"></div></section>

  <section id="shopping" class="tab" aria-label="Shopping">
    <p id="shopping-head" class="muted"></p>
    <div id="shopping-body"></div>
  </section>

  <!-- Progress took the place of Week, Trends and Summary: the overview is drawn by progress.js;
       the Sunday summary and one measure at a time open on request -->
  <section id="progress" class="tab" aria-label="Progress">
    <div id="progress-body"></div>
    <details id="progress-sunday" class="fold">
      <summary>The Sunday summary</summary>
      <div id="summary-body"></div>
    </details>
    <details id="progress-measures" class="fold">
      <summary>Measurements</summary>
      <div id="measures-body"></div>
    </details>
    <details id="progress-explore" class="fold">
      <summary>One measure, over a longer time</summary>
      <div class="row">
        <label for="metric">Measure</label>
        <select id="metric">
          <option value="weight">Weight</option>
          <option value="intake">Recorded intake</option>
          <option value="steps">Steps</option>
          <option value="sessions">Sessions</option>
          <option value="waist">Waist</option>
          <option value="hip">Hip / seat</option>
          <option value="chest">Chest</option>
          <option value="neck">Neck</option>
          <option value="overarm">Overarm</option>
          <option value="shoulder">Shoulder width</option>
          <option value="sleeve">Sleeve</option>
        </select>
        <label for="days">Days</label>
        <select id="days">
          <option value="30">30</option>
          <option value="90" selected>90</option>
          <option value="180">180</option>
          <option value="365">365</option>
        </select>
      </div>
      <div id="chart"></div>
      <p id="trends-note" class="muted" hidden></p>
    </details>
  </section>

  <section id="more" class="tab" aria-label="More"><div id="more-body"></div></section>
</main>

<p id="error" role="alert" hidden></p>

<!-- five destinations, always in reach of a thumb: the shop is read one-handed with a basket in
     the other -->
<nav id="tabs" aria-label="Sections">
  <button type="button" data-tab="today" id="tab-today" class="on" aria-current="page">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/><circle cx="12" cy="15" r="1.6"/></svg>
    <span>Today</span>
  </button>
  <button type="button" data-tab="menu" id="tab-menu">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v7M5 3v4a2 2 0 0 0 4 0V3M7 10v11M17 21V3c-2.2 1.6-3 4.4-3 7.5V13h3"/></svg>
    <span>Menu</span>
  </button>
  <button type="button" data-tab="shopping" id="tab-shopping">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1.4 11.2a1 1 0 0 1-1 .8H7.4a1 1 0 0 1-1-.8L5 8zM9 8V6.5a3 3 0 0 1 6 0V8"/></svg>
    <span>Shopping</span>
  </button>
  <button type="button" data-tab="progress" id="tab-progress">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h16M5 15.5l4.2-4.2 3.3 3.2L19 8"/><path d="M15 8h4v4"/></svg>
    <span>Progress</span>
  </button>
  <button type="button" data-tab="more" id="tab-more">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5.5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="18.5" cy="12" r="1.5"/></svg>
    <span>More</span>
  </button>
</nav>

<!-- hands-free cook: full screen, one step at a time, opened from a Today meal, a Menu slot
     or a Batch pot - client-side only, no write, no per-step ledger row (spec section 4) -->
<div id="cook-overlay" hidden role="dialog" aria-modal="true" aria-label="Cook">
  <div class="row">
    <p id="cook-progress" class="muted"></p>
    <button type="button" id="cook-close">Close</button>
  </div>
  <h2 id="cook-title"></h2>
  <p id="cook-step" aria-live="polite"></p>
  <details id="cook-ings" hidden><summary>Ingredients</summary><ul id="cook-ing-list"></ul></details>
  <div id="cook-zones">
    <button type="button" id="cook-left">&lsaquo; Back</button>
    <button type="button" id="cook-right">Next &rsaquo;</button>
  </div>
</div>

<!-- Charts load their library only when drawn. -->
<meta name="tiffin-plotly" content="{{static:plotly-basic-3.7.0.min.js}}">
<script type="module" src="{{static:app.js}}"></script>
</body>
</html>
