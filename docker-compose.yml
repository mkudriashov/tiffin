# A hardened example. Put the Telegram bot token (and, for the Claude CLI on a server, the output
# of `claude setup-token`) in ./secrets/, mode 0600, then:
#   docker compose run --rm tiffin tiffin init --web-mode proxy --web-origin https://tiffin.example.com
#   docker compose up -d --build
# The container's user (10010 here) must be able to read the secret files: `chown 10010 secrets/*`
# or mode 0440 with a shared group. With an API provider, drop the claude_oauth_token lines.
#
# The data volume's tiffin.toml must say, for a proxy in another container:
#   [web]
#   host = "0.0.0.0"
#   bind_trusted_network = true
# and the page's port is reachable only on the `app` network, never published.
services:
  tiffin:
    build: .
    image: tiffin:local
    # Five tries, then stop and stay stopped. If a second copy of the same Telegram bot is already
    # polling (an old install still running), Tiffin exits at once each time; "unless-stopped"
    # would restart it for ever and each start would begin its jobs again. Stop the old copy first.
    restart: on-failure:5
    # An init forwards docker stop's SIGTERM and reaps the Claude CLI's children; Tiffin stops cleanly on
    # SIGTERM (it ends its Telegram poll and gives work in flight 20 seconds), so the grace period
    # must be longer than that.
    init: true
    stop_grace_period: 30s
    user: "10010:10010" # match the image's TIFFIN_UID build argument
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 200
    environment:
      TIFFIN_HOME: /data
      TIFFIN_TELEGRAM_TOKEN_FILE: /run/secrets/telegram_token
      TIFFIN_CLAUDE_OAUTH_TOKEN_FILE: /run/secrets/claude_oauth_token
    secrets:
      - telegram_token
      - claude_oauth_token
    volumes:
      - tiffin-data:/data
    networks:
      - app # share this network with your reverse proxy; nothing is published to the host
      - egress # Telegram, intervals.icu and the model provider
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
networks:
  app:
    internal: true
  egress: {}
secrets:
  telegram_token:
    file: ./secrets/telegram-token.txt
  claude_oauth_token:
    file: ./secrets/claude-oauth-token.txt
volumes:
  tiffin-data:
