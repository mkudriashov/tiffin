# Ingredient catalogue: the foods the menu generator may use, two people cooking at home in the UK.
#
# `tiffin catalogue build` joins this file with data/cofid/cofid_2021_proximates.csv (CoFID 2021,
# per 100 g as published, OGL v3 — see data/cofid/LICENCE-OGL3.txt) and inserts a new
# `ingredients` version row whenever anything about a code changes. Never edit a CoFID number
# here; the row is referenced by `cofid_code`. Two documented exceptions exist:
#   fibre_100   fills a fibre that CoFID marks N (present, amount not quantified) or leaves blank.
#               Without it the row is stored with approved = 0 and never offered to the model.
#   macros_100  label values for a food CoFID does not carry (kcal, protein_g, fat_g, carb_g,
#               fibre_g per 100 g). Say where the numbers came from.
# Per-100 g values are for the food as bought (raw / dry / drained) unless the name says otherwise,
# because that is the weight the recipe lists and the shopping list buys.
#
# pack_g is the grams one purchase unit yields (drained weight for tins, 6 x 58 g for eggs);
# the shopping list rounds up to whole packs and carries the remainder as a leftover.
# pack_sizes_g lists other common unbranded pack sizes for least-waste planning.
# pantry: true  never appears on a shopping list — oil, salt, spices, rice, pasta, oats.
# use_whole_pack: true  the solver pins the segment's use of it to whole packs.
# person_scope: both | owner | partner.  aliases: other names the catalogue accepts exactly.

aisles: [produce, meat, fish, dairy, bakery, grains, tins, frozen, condiments]

